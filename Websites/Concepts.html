<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>iLPF Portal — Look & Feel Concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* canvas-only chrome — sits above the design canvas */
  html, body, #root { height: 100%; }
  body { overflow: hidden; }
  .brief {
    position: fixed; top: 20px; left: 20px; z-index: 50;
    max-width: 380px; background: #fff; border-radius: 16px;
    border: 1px solid #E4E7EB; box-shadow: 0 10px 30px rgba(0,61,58,0.08);
    padding: 22px 24px; font-family: 'Poppins', system-ui, sans-serif;
  }
  .brief .tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: #00B8A9;
  }
  .brief h2 { font-size: 18px; font-weight: 700; color: #003D3A; margin: 6px 0 8px; letter-spacing: -0.02em; }
  .brief p { font-size: 13px; line-height: 1.55; color: #4B5563; margin: 0 0 10px; }
  .brief ul { font-size: 13px; line-height: 1.55; color: #4B5563; padding-left: 16px; margin: 6px 0 10px; }
  .brief ul li { margin-bottom: 4px; }
  .brief .footer { font-size: 12px; color: #6B7280; padding-top: 10px; border-top: 1px solid #E4E7EB; margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="assets/design-canvas.jsx"></script>
<script type="text/babel" src="concepts/Chrome.jsx"></script>
<script type="text/babel" src="concepts/ConceptA.jsx"></script>
<script type="text/babel" src="concepts/ConceptB.jsx"></script>
<script type="text/babel" src="concepts/ConceptC.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

function Brief() {
  return (
    <aside className="brief">
      <span className="tag">iLPF Portal · Konsep</span>
      <h2>Tiga arah, satu sistem.</h2>
      <p>Semua tiga mengikut sistem reka bentuk yang sama — Poppins, Teal/Pine/Orange, the dot. Yang berbeza: <b>mood, susunan, dan cara jenama dituturkan</b>.</p>
      <ul>
        <li><b>A · Cinematic Light</b> — sinar cahaya pepenjuru, butiran filem, mod terang.</li>
        <li><b>B · Frame System</b> — editorial, tipografik, garis halus, ticker live.</li>
        <li><b>C · Pine Stage</b> — hero gelap, papan pemuka langsung, vibe SaaS premium.</li>
      </ul>
      <div className="footer">Pilih satu (atau campuran), saya akan bina seluruh portal.</div>
    </aside>
  );
}

function App() {
  useEffect(() => {
    const tick = () => window.lucide && lucide.createIcons();
    tick();
    // re-run after any layout change inside canvas
    const id = setInterval(tick, 600);
    return () => clearInterval(id);
  }, []);

  return (
    <>
      <DesignCanvas defaultZoom={0.42} minZoom={0.18} maxZoom={1.2}>
        <DCSection id="concepts" title="iLPF Portal · Look & Feel" subtitle="Tiga arahan reka bentuk — landing page (header + hero + satu seksyen sokongan)">
          <DCArtboard id="a" label="A · Cinematic Light" width={1440} height={1620}>
            <ConceptA />
          </DCArtboard>
          <DCArtboard id="b" label="B · Frame System" width={1440} height={1620}>
            <ConceptB />
          </DCArtboard>
          <DCArtboard id="c" label="C · Pine Stage" width={1440} height={1620}>
            <ConceptC />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <Brief />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
