<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDN iLPF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        oklch(98.5% 0.008 82);
      --line:      oklch(88% 0.012 82);
      --ink:       oklch(16% 0.012 262);
      --ink-muted: oklch(50% 0.01 262);
      --ink-faint: oklch(70% 0.01 262);

      --teal:      oklch(52% 0.19 185);
      --teal-soft: oklch(93% 0.05 185);
      --teal-mid:  oklch(86% 0.09 185);

      --orange:      oklch(61% 0.19 45);
      --orange-soft: oklch(94% 0.05 60);
      --orange-mid:  oklch(87% 0.1 55);

      --purple:      oklch(56% 0.21 295);
      --purple-soft: oklch(93% 0.05 295);
      --purple-mid:  oklch(86% 0.09 295);

      --green:      oklch(55% 0.17 145);
      --green-soft: oklch(93% 0.05 145);
      --green-mid:  oklch(86% 0.09 145);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px;
      min-height: 100vh;
    }

    .hub {
      width: 100%;
      max-width: 1100px;
    }

    /* ── Dots ── */
    .hub-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-teal   { background: var(--teal); }
    .dot-orange { background: var(--orange); }
    .dot-purple { background: var(--purple); }
    .dot-green  { background: var(--green); }

    /* ── Header ── */
    .hub-header {
      margin-bottom: 48px;
    }

    .hub-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }

    .hub-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(44px, 9vw, 72px);
      font-weight: 700;
      line-height: 0.93;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    /* ── Cards grid ── */
    .hub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (max-width: 640px) {
      .hub-grid { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 28px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--ink);
      min-height: 220px;
      transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 48px -8px var(--card-shadow, rgba(0,0,0,.12));
    }

    .card-teal {
      background: var(--teal-soft);
      --card-shadow: oklch(52% 0.19 185 / 0.2);
    }

    .card-teal:hover {
      background: var(--teal-mid);
    }

    .card-orange {
      background: var(--orange-soft);
      --card-shadow: oklch(61% 0.19 45 / 0.2);
    }

    .card-orange:hover {
      background: var(--orange-mid);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .card-number {
      font-family: 'Fraunces', serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--card-accent);
      opacity: 0.9;
    }

    .card-teal   { --card-accent: var(--teal); }
    .card-orange { --card-accent: var(--orange); }
    .card-purple { --card-accent: var(--purple); }
    .card-green  { --card-accent: var(--green); }

    .card-purple {
      background: var(--purple-soft);
      --card-shadow: oklch(56% 0.21 295 / 0.2);
    }

    .card-purple:hover {
      background: var(--purple-mid);
    }

    .card-green {
      background: var(--green-soft);
      --card-shadow: oklch(55% 0.17 145 / 0.2);
    }

    .card-green:hover {
      background: var(--green-mid);
    }

    .card-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover .card-arrow {
      transform: translate(3px, -3px);
    }

    .card-arrow svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .card-bottom {
      margin-top: 24px;
    }

    .card-name {
      font-family: 'Fraunces', serif;
      font-size: clamp(22px, 3.5vw, 28px);
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      letter-spacing: 0.01em;
    }

    /* ── Footer ── */
    .hub-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .footer-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .footer-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
    }

    .footer-chips {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .chip {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .chip-teal   { background: var(--teal-soft);   color: var(--teal); }
    .chip-orange { background: var(--orange-soft);  color: var(--orange); }
    .chip-green  { background: var(--green-soft);   color: var(--green); }
    .chip-purple { background: oklch(93% 0.05 295); color: var(--purple); }
  </style>
</head>
<body>

    <header class="hub-header">

    </header>

    <nav class="hub-grid" aria-label="Modul">

      <a class="card card-green" href="Websites/index.html">
        <div class="card-top">
          <span class="card-number" aria-hidden="true">03</span>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M8.5 4l4.5 4-4.5 4"/>

      <a class="card card-purple" href="System/index.php">
        <div class="card-top">
          <span class="card-number" aria-hidden="true">04</span>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M8.5 4l4.5 4-4.5 4"/>
            </svg>
          </span>

        <div class="card-bottom">
          <div class="card-name">System</div>

    </nav>

    <footer class="hub-footer">
      <span class="footer-label">2026</span>

      <div class="footer-chips" aria-hidden="true">
        <span class="chip chip-green">Live</span>
        <span class="chip chip-purple">Live</span>
      </div>
    </footer>

  </div>
  <a href="ilpf/index2.html" style="position:fixed;top:0;right:0;width:48px;height:48px;opacity:0;z-index:9999;" aria-hidden="true" tabindex="-1"></a>
</body>
</html>
