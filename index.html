<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDN iLPF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       oklch(11% 0.01 262);
      --line:     oklch(21% 0.01 262);
      --ink:      oklch(92% 0.008 200);
      --ink-muted: oklch(52% 0.008 200);
      --ink-faint: oklch(30% 0.008 200);
      --teal:     oklch(70% 0.12 185);
      --orange:   oklch(68% 0.14 45);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      min-height: 100vh;
    }

    .hub {
      width: 100%;
      max-width: 660px;
    }

    /* ── Header ── */
    .hub-header {
      margin-bottom: 52px;
    }

    .hub-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
    }

    .hub-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    /* ── Nav entries ── */
    .hub-nav {
      border-top: 1px solid var(--line);
    }

    .nav-entry {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 36px 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .nav-number {
      font-family: 'Fraunces', serif;
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--ink-faint);
      min-width: 24px;
      align-self: flex-start;
      padding-top: 6px;
      transition: color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-entry:hover .nav-number {
      color: var(--entry-accent);
    }

    .nav-content {
      flex: 1;
    }

    .nav-name {
      font-family: 'Fraunces', serif;
      font-size: clamp(26px, 4.5vw, 38px);
      font-weight: 600;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 8px;
      transition: color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-entry:hover .nav-name {
      color: var(--entry-accent);
    }

    .nav-desc {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--ink-muted);
      letter-spacing: 0.01em;
    }

    .nav-arrow {
      color: var(--ink-faint);
      flex-shrink: 0;
      transition:
        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-entry:hover .nav-arrow {
      transform: translateX(8px);
      color: var(--entry-accent);
    }

    .nav-arrow svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    /* ── Footer ── */
    .hub-footer {
      margin-top: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-text {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
    }

    .footer-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink-faint);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="hub">

    <header class="hub-header">
      <p class="hub-eyebrow">Kementerian Dalam Negeri</p>
      <h1 class="hub-title">KDN&nbsp;iLPF</h1>
    </header>

    <nav class="hub-nav" aria-label="Modul">

      <a class="nav-entry" href="MovingForward/index.html" style="--entry-accent: var(--teal)">
        <span class="nav-number" aria-hidden="true">01</span>
        <div class="nav-content">
          <div class="nav-name">Moving Forward</div>
          <div class="nav-desc">Prestasi &amp; Perkembangan</div>
        </div>
        <span class="nav-arrow" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h12M11 5l5 5-5 5"/>
          </svg>
        </span>
      </a>

      <a class="nav-entry" href="Profil/index.html" style="--entry-accent: var(--orange)">
        <span class="nav-number" aria-hidden="true">02</span>
        <div class="nav-content">
          <div class="nav-name">Profil</div>
          <div class="nav-desc">Analitik &amp; Dashboard</div>
        </div>
        <span class="nav-arrow" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h12M11 5l5 5-5 5"/>
          </svg>
        </span>
      </a>

    </nav>

    <footer class="hub-footer">
      <span class="footer-text">2026</span>
      <span class="footer-dot" aria-hidden="true"></span>
      <span class="footer-text">iLesen Penilaian Firma</span>
    </footer>

  </div>
</body>
</html>
