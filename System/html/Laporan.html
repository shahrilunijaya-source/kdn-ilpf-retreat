<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Laporan Tapisan · Borang LTF-A · iLPF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../ilpf.css">
<script src="js/data.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="laporan-body">
<div id="root"></div>

<script type="text/babel">
const TIND_LIGHT_KEY = {
  KABURKAN: 'KABURKAN', POTONGKAN: 'POTONGKAN', SENYAPKAN: 'SENYAPKAN',
  'PSA OVERLAY': 'PSA', 'SEMAK MANUAL': 'SEMAK',
};

function Toolbar() {
  return (
    <div className="lap-bar">
      <div>
        <strong>Laporan Tapisan Filem</strong>
        {' · '}
        <span style={{ color: 'var(--mute)', fontSize: 12 }}>Pratonton sebelum hantar</span>
      </div>
      <div className="lap-bar__cluster">
        <button className="lap-bar__btn lap-bar__btn--ghost" onClick={() => window.close()}>
          Tutup
        </button>
        <button className="lap-bar__btn" onClick={() => window.print()}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Cetak (PDF)
        </button>
      </div>
    </div>
  );
}

function Doc() {
  const data = window.iLPF.tapisanScreen;
  const me = window.iLPF.me;
  const stamp = "13 Mei 2026, 10:42 MYT";
  const docRef = "LTF-A/2026/05/00428";

  // Pre-accepted pengubahan: mirror Tapisan Screen's seed (3 AI rows + 2 manual demo rows)
  const pengubahan = [
    { ...data.aiPengubahan[0], source: 'ai' },
    { ...data.aiPengubahan[2], source: 'ai' },
    { ...data.aiPengubahan[4], source: 'ai' },
    { bil: '04M', dan: '00:11:02', hingga: '00:11:18', tindakan: 'KABURKAN', adegan: 'JENAMA', desc: 'Logo komersial dipaparkan tanpa pengisytiharan (manual).', source: 'manual' },
    { bil: '05M', dan: '00:15:34', hingga: '00:15:55', tindakan: 'SENYAPKAN', adegan: 'BAHASA', desc: '2 sebutan profaniti tambahan dikesan oleh Ketua Panel.', source: 'manual' },
  ];

  // Decision (matches the AI default + spec wrap-up)
  const klasifikasi = "13";
  const keputusan = "LDP";
  const keputusanName = "Lulus Dengan Pengubahan";

  // Pemberat from AI cadangan
  const pemberat = data.aiKeputusan.pemberat;

  // Panel from a 'fully filled' state for the report
  const panel = {
    ketua: { name: me.name, role: 'Ketua Panel' },
    ahli: [
      { name: 'Datin Yamunarani A/P R. Muthuthamby Pillay', role: 'Ahli Panel · Bahasa' },
      { name: 'Dato Dr Nik Azmi Bin Nik Omar', role: 'Ahli Panel · Keagamaan' },
    ],
  };

  return (
    <div className="lap-doc">
      <div className="lap-watermark">iLPF</div>

      {/* Header */}
      <header className="lap-head">
        <div className="lap-head__org">
          <div className="lap-head__seal">
            <div className="top">KDN</div>
            <div className="star">★</div>
            <div className="bot">PPF</div>
          </div>
          <div className="lap-head__titles">
            <div className="org">Pejabat Penapisan Filem</div>
            <div className="sub">Kementerian Dalam Negeri · Malaysia</div>
            <div style={{ marginTop: 4 }}>Lembaga Penapisan Filem (LPF)</div>
          </div>
        </div>
        <div className="lap-head__doc">
          <div className="borang">Borang LTF-A · v2</div>
          <div className="ref">{docRef}</div>
          <div className="meta">Disediakan: {stamp}</div>
        </div>
      </header>

      {/* Title block */}
      <div className="lap-title">
        <div>
          <h1 className="lap-title__h1">{data.info.title}</h1>
          <div className="lap-title__sub">
            {data.info.perakuan} · <strong>{data.info.noPermohonan}</strong> · {data.info.pengedar}
            <br />
            Tarikh hantar permohonan: {data.info.tarikhHantar} · Disampaikan kepada panel: 10 Mac 2026
          </div>
        </div>
        <div className={`lap-stamp lap-stamp--${klasifikasi}`}>
          <div className="lap-stamp__eyebrow">Klasifikasi</div>
          <div className="lap-stamp__code">{klasifikasi}</div>
          <div className="lap-stamp__name">{keputusan}</div>
        </div>
      </div>

      {/* Maklumat grid */}
      <div className="lap-grid">
        {[
          ['Jenis permohonan', data.info.perakuan],
          ['No. Permohonan', data.info.noPermohonan],
          ['Pengedar', data.info.pengedar],
          ['Film ID', data.info.filmId],
          ['Tarikh tapisan', '13 Mei 2026'],
          ['Tempoh skrin', '2 jam 56 min'],
          ['Asal', 'Tempatan · Malaysia'],
          ['Format media', 'DVD · MP4 (1080p)'],
        ].map(([k, v], i) => (
          <div key={i} className="lap-grid__row">
            <span className="k">{k}</span>
            <span className="v">{v}</span>
          </div>
        ))}
        <div className="lap-grid__row" style={{ gridColumn: '1 / -1', gridTemplateColumns: '130px 1fr' }}>
          <span className="k">Kategori</span>
          <div className="lap-pills">
            {data.info.kategori.map((c) => <span key={c} className="lap-pill">{c}</span>)}
          </div>
        </div>
      </div>

      {/* §1 Sinopsis */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§1</span>
          <span className="lap-sec__title">Sinopsis</span>
          <span className="lap-sec__meta">Disahkan oleh Ketua Panel</span>
        </div>
        <div className="lap-sec__body">{data.aiSinopsis.text}</div>
      </section>

      {/* §2 Dialog */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§2</span>
          <span className="lap-sec__title">Dialog &amp; Sari Kata</span>
          <span className="lap-sec__meta">Analisis ASR + OCR</span>
        </div>
        <div className="lap-sec__body">{data.aiDialog.text}</div>
      </section>

      {/* §3 Genre + Tema */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§3</span>
          <span className="lap-sec__title">Genre &amp; Tema</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, fontSize: 11 }}>
          <div>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.10em', color: 'var(--lap-mute)', textTransform: 'uppercase', marginBottom: 4 }}>Genre</div>
            <div className="lap-pills">
              {data.aiGenre.top3.map((g) => <span key={g} className="lap-pill">{g}</span>)}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.10em', color: 'var(--lap-mute)', textTransform: 'uppercase', marginBottom: 4 }}>Tema</div>
            <div className="lap-pills">
              {data.aiTema.top3.map((t) => <span key={t} className="lap-pill">{t}</span>)}
            </div>
          </div>
        </div>
      </section>

      {/* §4 Senarai pengubahan */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§4</span>
          <span className="lap-sec__title">Senarai Pengubahan</span>
          <span className="lap-sec__meta">
            {pengubahan.length} pengubahan ·
            {' '}{pengubahan.filter((p) => p.source === 'ai').length} daripada AI
            {' · '}{pengubahan.filter((p) => p.source === 'manual').length} manual
          </span>
        </div>
        <table className="lap-pen">
          <thead>
            <tr>
              <th>Bil</th>
              <th>Dan</th>
              <th>Hingga</th>
              <th>Tindakan</th>
              <th>Adegan</th>
              <th>Keterangan</th>
              <th>Sumber</th>
            </tr>
          </thead>
          <tbody>
            {pengubahan.map((p, i) => (
              <tr key={i}>
                <td className="tbil">{p.bil}</td>
                <td className="tnum">{p.dan}</td>
                <td className="tnum">{p.hingga}</td>
                <td><span className={`tind tind-${TIND_LIGHT_KEY[p.tindakan] || p.tindakan}`}>{p.tindakan}</span></td>
                <td style={{ fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 600 }}>{p.adegan}</td>
                <td>{p.desc}</td>
                <td style={{ fontSize: 10, color: 'var(--lap-mute)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>
                  {p.source === 'ai' ? 'AI' : 'Manual'}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>

      {/* §5 Pemberat */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§5</span>
          <span className="lap-sec__title">Pemberat Kandungan</span>
          <span className="lap-sec__meta">10 kategori × 7 tahap</span>
        </div>
        <div className="lap-pem">
          {data.pemberatRows.map((r) => (
            <div key={r.id} className="lap-pem__row">
              <span className="lap-pem__label">{r.label}</span>
              <div className="lap-pem__scale">
                {Array.from({ length: 7 }).map((_, i) => (
                  <div key={i} className={`lap-pem__seg ${i <= (pemberat[r.id] ?? -1) ? 'is-active' : ''}`} />
                ))}
              </div>
            </div>
          ))}
          <div className="lap-pem__legend">
            <span />
            <div className="lap-pem__legend-row">
              {data.pemberatLabels.map((l) => <span key={l}>{l}</span>)}
            </div>
          </div>
        </div>
      </section>

      {/* §6 Keputusan */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§6</span>
          <span className="lap-sec__title">Keputusan Tapisan</span>
        </div>
        <div className="lap-kep">
          <div className="lap-kep__line">
            Berdasarkan {pengubahan.length} pengubahan yang direkodkan, analisis adegan,
            audio, dan dialog, panel mengesahkan keputusan tapisan sebagai
            <span className="codepin">{keputusan}</span>
            (<strong>{keputusanName}</strong>) dengan klasifikasi
            <span className="codepin">{klasifikasi}</span>
            (<strong>Penjaga · Kanak-kanak bawah 13 tahun mesti ditemani penjaga</strong>).
          </div>
          <div className="lap-kep__line" style={{ marginTop: 8, color: 'var(--lap-mute)' }}>
            Pemberat tertinggi: <strong>Ganas (Sederhana) · Seram (Sederhana) · Bahasa (Sederhana)</strong>.
            Tiada elemen yang melepasi tahap "Berat" atau ke atas.
          </div>
        </div>
      </section>

      {/* §7 Panel — signatures */}
      <section className="lap-sec">
        <div className="lap-sec__h">
          <span className="lap-sec__no">§7</span>
          <span className="lap-sec__title">Pengesahan Ahli Panel</span>
          <span className="lap-sec__meta">3 anggota panel</span>
        </div>
        <div className="lap-sig">
          <div className="lap-sig__cell">
            <div className="lap-sig__line">
              <div className="lap-sig__name">{panel.ketua.name}</div>
              <div className="lap-sig__role">{panel.ketua.role}</div>
              <div className="lap-sig__date">Tarikh: 13/05/2026</div>
            </div>
          </div>
          {panel.ahli.map((a, i) => (
            <div key={i} className="lap-sig__cell">
              <div className="lap-sig__line">
                <div className="lap-sig__name">{a.name}</div>
                <div className="lap-sig__role">{a.role}</div>
                <div className="lap-sig__date">Tarikh: 13/05/2026</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* Footer */}
      <div className="lap-foot">
        <span>iLPF v2.0.0-alpf · sha 7b3c2f · <strong>SULIT</strong> — Untuk kegunaan rasmi Pejabat Penapisan Filem KDN sahaja.</span>
        <span className="page">1 / 1</span>
      </div>
    </div>
  );
}

function App() {
  React.useEffect(() => {
    document.title = "Laporan Tapisan · PCBM20260396966 · iLPF";
  }, []);
  return (
    <>
      <Toolbar />
      <Doc />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
