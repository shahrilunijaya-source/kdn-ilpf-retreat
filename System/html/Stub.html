<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Halaman akan datang · iLPF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../ilpf.css">
<script src="js/data.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/icons.jsx"></script>
<script type="text/babel" src="js/shell.jsx"></script>

<script type="text/babel">
const params = new URLSearchParams(location.search);
const label = (params.get('p') || 'Halaman').replace(/\+/g, ' ');

function StubPage() {
  const I = window.Icons;
  React.useEffect(() => { document.title = `${label} · iLPF`; }, []);
  return (
    <Shell activeKey="" context={label}>
      <div className="ws-page" style={{ gridTemplateColumns: '1fr' }}>
        <div className="ws-page__main">
          <div className="stub-hero">
            <div className="stub-hero__eyebrow">DALAM PEMBINAAN</div>
            <h1 className="stub-hero__title">{label}<span className="dot" /></h1>
            <p className="stub-hero__sub">
              Skrin ini akan disampaikan dalam fasa berikutnya. Buat masa ini, navigasi dan
              kekal dalam ruang kerja ALPF.
            </p>
            <a className="stub-hero__back" href="Utama.html">
              <I.arrowL /> Kembali ke Utama
            </a>
          </div>
        </div>
      </div>
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StubPage />);
</script>
</body>
</html>
